<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>input</title>
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="p-10">
    <input
      type="text"
      placeholder="Name"
      class="input input-info"
    /><br /><br />
    <input
      type="email"
      placeholder="Email"
      class="input input-info"
    /><br /><br />
    <input type="password" placeholder="Password" class="input input-info" />

    <br /><br />
    <hr />
    <br />

    <input type="text" placeholder="enter text" class="input input-sm" /><br />
    <input type="text" placeholder="enter text" class="input input" /><br />
    <input type="text" placeholder="enter text" class="input input-lg" />

    <br /><br />
    <hr />
    <br />
    <input
      type="text"
      placeholder="Success"
      class="input input-success"
    /><br />
    <input
      type="text"
      placeholder="Warning"
      class="input input-warning"
    /><br />
    <input type="text" placeholder="Error" class="input input-error" />
    <br /><br />
    <hr />
    <br />
    <div class="space-y-3">
      <h1 class="text-2xl font-bold">Login</h1>

      <input type="email" placeholder="Email" class="input input-bordered" />
      <input
        type="password"
        placeholder="Password"
        class="input input-bordered"
      />
      <button class="btn btn-primary">Login</button>
    </div>
  </body>
</html>
